name: Shared core and language interfaces

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify synchronized core
        run: python tools/sync_core.py --check
      - name: Headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev libboost-math-dev
      - name: Headers (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install eigen boost
          echo "EIGEN3_INCLUDE_DIR=$(brew --prefix eigen)/include/eigen3" >> "$GITHUB_ENV"
          echo "BOOST_INCLUDE_DIR=$(brew --prefix boost)/include" >> "$GITHUB_ENV"
      - name: Headers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install eigen3:x64-windows boost-math:x64-windows
          "EIGEN3_INCLUDE_DIR=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/include/eigen3" >> $env:GITHUB_ENV
          "BOOST_INCLUDE_DIR=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/include" >> $env:GITHUB_ENV
      - name: Build source archive and wheel
        run: |
          python -m pip install build pytest numpy
          python -m build python
      - name: Install built wheel
        shell: python
        run: |
          import pathlib, subprocess, sys
          wheels = list(pathlib.Path('python/dist').glob('*.whl'))
          assert len(wheels) == 1, wheels
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheels[0])])
      - name: Python tests
        run: python -m pytest python/tests -q
      - name: Install minimum scikit-learn (Python 3.10)
        if: matrix.python == '3.10'
        run: python -m pip install "scikit-learn>=1.6,<1.7"
      - name: Install current scikit-learn (Python 3.14)
        if: matrix.python == '3.14'
        run: python -m pip install "scikit-learn>=1.6"
      - name: Estimator lifecycle and numerical tests
        run: python -m pytest python/tests/test_sklearn.py -q
      - name: Install optional CPU PyTorch
        if: matrix.python == '3.14' && runner.os != 'macOS'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Tensor integration tests
        if: matrix.python == '3.14' && runner.os != 'macOS'
        run: python -m pytest python/tests/test_torch.py python/tests/test_sklearn.py::test_tensors_work_with_estimator_and_optional_callbacks -q
      - name: CPU benchmark smoke run
        if: matrix.python == '3.14' && runner.os == 'Linux'
        run: python python/benchmarks/bench_cpu.py --suite quick --repeats 2 --inputs numpy torch-cpu --output python/benchmarks/results/ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.os }}-${{ matrix.python }}
          path: |
            python/dist/*
            python/benchmarks/results/*.json

  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-fonts-recommended texlive-latex-recommended
      - name: R dependencies
        shell: Rscript {0}
        run: install.packages(c("Rcpp", "RcppEigen", "BH", "knitr", "rmarkdown"))
      - name: Check R source package
        shell: bash
        run: |
          python tools/sync_core.py --check
          R CMD build bagelR
          R CMD check --as-cran bagelR_*.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r-check
          path: bagelR.Rcheck/00check.log
